            const API = {
                async generateAIResponse(question) {
                    const controller = new AbortController();
                    const timeout = 120000;
                    setTimeout(() => controller.abort(), timeout);

                    try {
                        const headers = {
                            "Authorization": `Bearer ${OPENROUTER_API_KEY}`,
                            "Content-Type": "application/json",
                            "HTTP-Referer": window.location.origin,
                            "X-Title": "NeuroFlora"
                        };

                        const languagePrompts = {
                            ru: "Отвечай на русском языке простым текстом без форматирования.",
                            en: "Answer in English with plain text without formatting.",
                            uk: "Відповідай українською мовою простим текстом без форматування.",
                            be: "Адказвай на беларускай мове простым тэкстам без фарматавання.",
                            kk: "Қазақ тілінде жай мәтінмен, пішімдеусіз жауап бер.",
                            fr: "Répondez en français en texte brut sans mise en forme."
                        };

                        const model = "openai/gpt-oss-120b:free";
                        const t = texts[state.userSettings.language] || texts.ru;
                        
                        const premiumPromptAddition = state.userSettings.isPremium ? 
                            "Давай максимально развернутые и профессиональные ответы. Используй научные термины, но объясняй их простым языком. Учитывай современные методы садоводства." : 
                            "Будь краток, но информативен. Давай практические советы.";

                        const prompt = `Ты — опытный садовод и ботаник. Отвечай на вопросы о растениях четко и структурированно.
${languagePrompts[state.userSettings.language] || languagePrompts.ru}

Требования:
1. Отвечай только на вопросы о садоводстве и ботанике
2. Будь максимально точным и информативным
3. Не используй форматирование (жирный, курсив, списки)
4. Используй только обычный текст
5. Ограничь ответ ${state.userSettings.isPremium ? '800' : '500'} словами
6. Пиши простым, понятным языком
7. Не используй спецсимволы для выделения текста
8. ${premiumPromptAddition}

Вопрос: ${sanitizeInput(question)}`;

                        const data = {
                            model: model,
                            messages: [
                                {
                                    role: "system",
                                    content: `Ты опытный садовод и ботаник. Отвечай профессионально, но доступно. ${state.userSettings.isPremium ? 'Давай более подробные ответы с научными терминами.' : 'Будь краток и практичен.'} Никогда не используй форматирование (жирный, курсив, списки).`
                                },
                                {
                                    role: "user",
                                    content: prompt
                                }
                            ],
                            max_tokens: state.userSettings.isPremium ? 2000 : 1000,
                            temperature: 0.7
                        };

                        const response = await fetch(API_URL, {
                            method: "POST",
                            headers,
                            body: JSON.stringify(data),
                            signal: controller.signal
                        });

                        if (!response.ok) {
                            throw new Error('API_ERROR');
                        }

                        const result = await response.json();
                        const content = result.choices[0].message.content.trim();
                        
                        const cleanedContent = content.replace(/\*\*(.*?)\*\*/g, '$1')
                            .replace(/\*(.*?)\*/g, '$1')
                            .replace(/#{1,6}\s?/g, '')
                            .replace(/`{1,3}/g, '')
                            .replace(/\[(.*?)\]\(.*?\)/g, '$1')
                            .replace(/\n{3,}/g, '\n\n');
                        
                        const maxLength = state.userSettings.isPremium ? 4000 : 2500;
                        if (cleanedContent.length > maxLength) {
                            return cleanedContent.substring(0, maxLength);
                        }
                        
                        return sanitizeInput(cleanedContent);
                    } catch (error) {
                        console.error('API Request Error:', error);
                        const t = texts[state.userSettings.language] || texts.ru;
                        return t.sendError;
                    }
                }
            };

            const Utils = {
                formatTime: (dateString) => {
                    const date = new Date(dateString);
                    return date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

                autoResizeTextarea: (textarea) => {
                    textarea.style.height = 'auto';
                    const maxHeight = 120;
                    const scrollHeight = textarea.scrollHeight;
                    textarea.style.height = Math.min(scrollHeight, maxHeight) + 'px';
                },

                scrollToBottom: () => {

                trackAdImpression: (adIndex) => {
                    if (!state.userSettings.adStats.impressions[adIndex]) {

                    state.userSettings.adStats.impressions[adIndex]++;
                    state.userSettings.adStats.totalImpressions++;
                    
                    if (!state.userSettings.adStats.uniqueUsers.has(state.userSessionId)) {
                        state.userSettings.adStats.uniqueUsers.add(state.userSessionId);

                    saveToStorage('neuroflora_ad_stats', {
                        impressions: state.userSettings.adStats.impressions,

                    this.setupUserProfile();

                        DOM.adminBtn.style.display = 'flex';

                },

                setupUserProfile() {
                    const savedUser = loadFromStorage('neuroflora_user', null);
                    if (savedUser) {
                        DOM.userName.textContent = savedUser.name || 'Пользователь';
                        if (savedUser.photo_url) {
                            DOM.userAvatar.style.backgroundImage = `url(${savedUser.photo_url})`;
                            DOM.userAvatar.style.backgroundSize = 'cover';
                            DOM.userAvatar.textContent = '';

                    } else {
                        DOM.telegramAuthContainer.style.display = 'block';
                    }
                },

                loadCurrentChat() {
                    const chat = state.chats[state.currentChatId];
                    DOM.messagesContainer.innerHTML = '';
                    
                    if (!chat || !chat.messages || chat.messages.length === 0) {
                        DOM.welcomeMessage.style.display = 'flex';
                        DOM.welcomeMessage.classList.add('show');
                    } else {
                        DOM.welcomeMessage.style.display = 'none';
                        DOM.welcomeMessage.classList.remove('show');
                        chat.messages.forEach(msg => this.renderMessage(msg));
                        Utils.scrollToBottom();
                    }
                    
                    this.updateChatHeader();
                },

                renderMessage(msg) {
                    if (msg.id === 'welcome') return;
                    
                    const t = texts[state.userSettings.language] || texts.ru;
                    const time = Utils.formatTime(msg.timestamp);
                    const isUserMessage = msg.role === 'user';
                    const author = isUserMessage ? 'Вы' : 'NeuroFlora';
                    
                    const messageDiv = document.createElement('div');
                    messageDiv.className = `message ${isUserMessage ? 'user-message' : 'bot-message'}`;
                    messageDiv.id = `message-${msg.id}`;
                    
                    const messageContainer = document.createElement('div');
                    messageContainer.className = 'message-container';
                    
                    const avatar = document.createElement('div');
                    avatar.className = `message-avatar ${isUserMessage ? 'user-avatar-sm' : 'bot-avatar-sm'}`;
                    
                    if (isUserMessage) {
                        const savedUser = loadFromStorage('neuroflora_user', null);
                        const userName = savedUser?.name || 'Вы';
                        if (savedUser?.photo_url) {
                            avatar.style.backgroundImage = `url(${savedUser.photo_url})`;
                            avatar.style.backgroundSize = 'cover';
                            avatar.textContent = '';
                        } else {
                            avatar.style.backgroundImage = '';
                            avatar.textContent = userName.charAt(0).toUpperCase();
                        }
                    }
                    
                    const contentWrapper = document.createElement('div');
                    contentWrapper.className = 'message-content-wrapper';
                    
                    const header = document.createElement('div');
                    header.className = 'message-header';
                    
                    const authorEl = document.createElement('div');
                    authorEl.className = 'message-author';
                    authorEl.textContent = author;
                    
                    const timeEl = document.createElement('div');
                    timeEl.className = 'message-time';
                    timeEl.textContent = time;
                    
                    header.appendChild(authorEl);
                    header.appendChild(timeEl);
                    
                    const content = document.createElement('div');
                    content.className = 'message-content';
                    content.textContent = msg.content.trim();
                    
                    contentWrapper.appendChild(header);
                    contentWrapper.appendChild(content);
                    
                    if (!isUserMessage) {
                        const rating = state.messageRatings[msg.id];
                        const chat = state.chats[state.currentChatId];
                        const isLastAIMessage = chat.messages[chat.messages.length - 1]?.id === msg.id;
                        
                        const actions = document.createElement('div');
                        actions.className = 'message-actions';
                        
                        const likeBtn = document.createElement('button');
                        likeBtn.className = `action-btn ${rating === 'like' ? 'active' : ''}`;
                        likeBtn.innerHTML = DOMPurify.sanitize(`<i class="fas fa-thumbs-up"></i> ${t.rateHelpful}`);
                        likeBtn.onclick = () => this.rateMessage(msg.id, 'like');
                        
                        const dislikeBtn = document.createElement('button');
                        dislikeBtn.className = `action-btn ${rating === 'dislike' ? 'active' : ''}`;
                        dislikeBtn.innerHTML = DOMPurify.sanitize(`<i class="fas fa-thumbs-down"></i> ${t.rateNotHelpful}`);
                        dislikeBtn.onclick = () => this.rateMessage(msg.id, 'dislike');
                        
                        const copyBtn = document.createElement('button');
                        copyBtn.className = 'action-btn';
                        copyBtn.innerHTML = DOMPurify.sanitize(`<i class="fas fa-copy"></i> ${t.copy}`);
                        copyBtn.onclick = () => this.copyMessage(msg.id);
                        
                        actions.appendChild(likeBtn);
                        actions.appendChild(dislikeBtn);
                        actions.appendChild(copyBtn);
                        
                        if (isLastAIMessage) {
                            const regenerateBtn = document.createElement('button');
                            regenerateBtn.className = 'action-btn';
                            regenerateBtn.innerHTML = DOMPurify.sanitize(`<i class="fas fa-redo"></i> ${t.regenerate}`);
                            regenerateBtn.onclick = () => this.regenerateResponse(msg.id);
                            actions.appendChild(regenerateBtn);
                        }
                        
                        contentWrapper.appendChild(actions);
                    }
                    
                    messageContainer.appendChild(avatar);
                    messageContainer.appendChild(contentWrapper);
                    messageDiv.appendChild(messageContainer);
                    DOM.messagesContainer.appendChild(messageDiv);
                },

                async sendMessage() {
                    const input = DOM.messageInput;
                    const text = sanitizeInput(input.value);
                    
                    if (!validateMessage(text)) {
                        const t = texts[state.userSettings.language] || texts.ru;
                        alert(`Сообщение слишком длинное (максимум ${state.userSettings.isPremium ? '4000' : '2000'} символов)`);
                        return;
                    }
                    
                    DOM.sendButton.disabled = true;
                    
                    const userMessage = {
                        id: Date.now().toString(),
                        role: 'user',
                        content: text,
                        timestamp: new Date().toISOString()
                    };
                    
                    this.addMessageToChat(userMessage);
                    this.renderMessage(userMessage);
                    
                    input.value = '';
                    this.updateCharCount();
                    Utils.autoResizeTextarea(input);
                    
                    DOM.welcomeMessage.style.display = 'none';
                    DOM.welcomeMessage.classList.remove('show');
                    
                    Utils.scrollToBottom();
                    this.showTypingIndicator();
                    
                    try {
                        const aiResponse = await API.generateAIResponse(text);
                        this.hideTypingIndicator();
                        
                        const aiMessage = {
                            id: Date.now().toString(),
                            role: 'assistant',
                            content: aiResponse,
                            timestamp: new Date().toISOString()
                        };
                        
                        this.addMessageToChat(aiMessage);
                        this.renderMessage(aiMessage);
                        
                        this.updateChatTitle();
                        this.loadHistoryList();
                        this.updateStatistics();
                        
                        Utils.scrollToBottom();
                    } catch (error) {
                        this.hideTypingIndicator();
                        const t = texts[state.userSettings.language] || texts.ru;
                        const errorMessage = {
                            id: Date.now().toString(),
                            role: 'assistant',
                            content: t.sendError,
                            timestamp: new Date().toISOString()
                        };
                        
                        this.addMessageToChat(errorMessage);
                        this.renderMessage(errorMessage);
                        Utils.scrollToBottom();
                    } finally {
                        DOM.sendButton.disabled = false;
                    }
                },

                async regenerateResponse(messageId) {
                    const chat = state.chats[state.currentChatId];
                    const messageIndex = chat.messages.findIndex(m => m.id === messageId);
                    
                    if (messageIndex === -1 || chat.messages[messageIndex].role !== 'assistant') return;
                    
                    const userMessage = chat.messages[messageIndex - 1];
                    if (!userMessage || userMessage.role !== 'user') return;
                    
                    chat.messages.splice(messageIndex, 1);
                    this.saveChats();
                    this.loadCurrentChat();
                    
                    this.showTypingIndicator();
                    
                    try {
                        const aiResponse = await API.generateAIResponse(userMessage.content);
                        this.hideTypingIndicator();
                        
                        const aiMessage = {
                            id: Date.now().toString(),
                            role: 'assistant',
                            content: aiResponse,
                            timestamp: new Date().toISOString()
                        };
                        
                        this.addMessageToChat(aiMessage);
                        this.renderMessage(aiMessage);
                        
                        this.updateStatistics();
                        Utils.scrollToBottom();
                    } catch (error) {
                        this.hideTypingIndicator();
                        const t = texts[state.userSettings.language] || texts.ru;
                        const errorMessage = {
                            id: Date.now().toString(),
                            role: 'assistant',
                            content: t.sendError,
                            timestamp: new Date().toISOString()
                        };
                        
                        this.addMessageToChat(errorMessage);
                        this.renderMessage(errorMessage);
                        Utils.scrollToBottom();
                    }
                },

                addMessageToChat(message) {
                    const chat = state.chats[state.currentChatId];
                    if (!chat.messages) chat.messages = [];
                    message.content = message.content.trim();
                    chat.messages.push(message);
                    chat.updatedAt = new Date().toISOString();
                    this.saveChats();
                },

                updateChatTitle() {
                    const chat = state.chats[state.currentChatId];
                    const lastUserMessage = chat.messages.find(m => m.role === 'user');
                    if (lastUserMessage && lastUserMessage.content) {
                        const title = lastUserMessage.content.substring(0, 50) + (lastUserMessage.content.length > 50 ? '...' : '');
                        const t = texts[state.userSettings.language] || texts.ru;
                        if (chat.title === 'Новый чат' || chat.title === t.newChat) {
                            chat.title = title;
                            this.saveChats();
                            this.updateChatHeader();
                        }
                    }
                },

                updateChatHeader() {
                    const chat = state.chats[state.currentChatId];
                    DOM.currentChatTitle.textContent = chat?.title || 'NeuroFlora';
                },

                showTypingIndicator() {
                    const t = texts[state.userSettings.language] || texts.ru;
                    const typingDiv = document.createElement('div');
                    typingDiv.className = 'typing-indicator';
                    typingDiv.id = 'typing-indicator';
                    typingDiv.innerHTML = DOMPurify.sanitize(`
                        <div class="bot-avatar-sm" style="background-image: url('https://i.postimg.cc/SxdqDwpy/Bez-nazvania54-20251214232638.png')"></div>
                        <div class="typing-dots">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                        <div>${t.typing} ${state.userSettings.isPremium ? '⚡' : ''}</div>
                    `);
                    DOM.messagesContainer.appendChild(typingDiv);
                    Utils.scrollToBottom();
                },

                hideTypingIndicator() {
                    const indicator = document.getElementById('typing-indicator');
                    if (indicator) indicator.remove();
                },

                rateMessage(messageId, rating) {
                    state.messageRatings[messageId] = rating;
                    saveToStorage('neuroflora_ratings', state.messageRatings);
                    this.updateStatistics();
                },

                copyMessage(messageId) {
                    const messageDiv = document.getElementById(`message-${messageId}`);
                    if (messageDiv) {
                        const text = messageDiv.querySelector('.message-content').textContent;
                        navigator.clipboard.writeText(text).then(() => {
                            const t = texts[state.userSettings.language] || texts.ru;
                            alert(t.copySuccess);
                        });
                    }
                },

                createNewChat() {
                    const chatId = Date.now().toString();
                    const t = texts[state.userSettings.language] || texts.ru;
                    const newChat = {
                        id: chatId,
                        title: t.newChat,
                        messages: [],
                        createdAt: new Date().toISOString(),
                        updatedAt: new Date().toISOString()
                    };
                    
                    state.chats[chatId] = newChat;
                    state.currentChatId = chatId;
                    this.saveChats();
                    
                    this.loadCurrentChat();
                    this.loadHistoryList();
                    
                    if (Utils.isMobile()) this.closeSidebar();
                },

                clearCurrentChat() {
                    const t = texts[state.userSettings.language] || texts.ru;
                    if (confirm(t.confirmClear)) {
                        const chat = state.chats[state.currentChatId];
                        chat.messages = [];
                        chat.updatedAt = new Date().toISOString();
                        this.saveChats();
                        
                        this.loadCurrentChat();
                        this.updateStatistics();
                        alert(t.chatCleared);
                    }
                },

                deleteChat(chatId, event) {
                    event?.stopPropagation();
                    const t = texts[state.userSettings.language] || texts.ru;
                    if (!confirm(t.confirmDeleteChat)) return;
                    
                    if (chatId === state.currentChatId) {
                        state.currentChatId = 'default';
                        if (!state.chats.default) {
                            const t = texts[state.userSettings.language] || texts.ru;
                            state.chats.default = {
                                id: 'default',
                                title: t.newChat,
                                messages: [],
                                createdAt: new Date().toISOString(),
                                updatedAt: new Date().toISOString()
                            };
                        }
                        this.loadCurrentChat();
                    }
                    
                    delete state.chats[chatId];
                    this.saveChats();
                    this.loadHistoryList();
                    this.updateStatistics();
                },

                loadHistoryList() {
                    const container = DOM.historyList;
                    const chatIds = Object.keys(state.chats);
                    
                    const hasMessages = chatIds.some(id => {
                        const chat = state.chats[id];
                        return chat && chat.messages && chat.messages.length > 0;
                    });
                    
                    if (!hasMessages) {
                        const t = texts[state.userSettings.language] || texts.ru;
                        container.innerHTML = DOMPurify.sanitize(`
                            <div style="padding: 40px 20px; text-align: center; color: var(--text-tertiary);">
                                <i class="fas fa-history" style="font-size: 32px; margin-bottom: 12px; opacity: 0.5;"></i>
                                <div>${t.noHistory}</div>
                            </div>
                        `);
                        return;
                    }
                    
                    const sortedChats = chatIds
                        .map(id => state.chats[id])
                        .filter(chat => chat && chat.messages && chat.messages.length > 0)
                        .sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));
                    
                    container.innerHTML = '';
                    
                    sortedChats.forEach(chat => {
                        if (!chat) return;
                        
                        const lastMessage = chat.messages[chat.messages.length - 1];
                        let preview;
                        if (lastMessage) {
                            const cleanContent = lastMessage.content.trim();
                            preview = cleanContent.substring(0, 50) + (cleanContent.length > 50 ? '...' : '');
                        } else {
                            const t = texts[state.userSettings.language] || texts.ru;
                            preview = t.newChat;
                        }
                        
                        const time = new Date(chat.updatedAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                        const historyItem = document.createElement('div');
                        historyItem.className = `history-item ${chat.id === state.currentChatId ? 'active' : ''}`;
                        
                        const historyPreview = document.createElement('div');
                        historyPreview.className = 'history-preview';
                        
                        const historyText = document.createElement('div');
                        historyText.className = 'history-text';
                        historyText.textContent = preview;
                        
                        const historyTime = document.createElement('div');
                        historyTime.className = 'history-time';
                        historyTime.textContent = time;
                        
                        historyPreview.appendChild(historyText);
                        historyPreview.appendChild(historyTime);
                        
                        const deleteBtn = document.createElement('button');
                        deleteBtn.className = 'history-delete-btn';
                        deleteBtn.innerHTML = '<i class="fas fa-trash"></i>';
                        deleteBtn.onclick = (e) => this.deleteChat(chat.id, e);
                        
                        historyItem.appendChild(historyPreview);
                        historyItem.appendChild(deleteBtn);
                        historyItem.onclick = () => this.switchChat(chat.id);
                        
                        container.appendChild(historyItem);
                    });
                },

                switchChat(chatId) {
                    state.currentChatId = chatId;
                    this.loadCurrentChat();
                    this.loadHistoryList();
                    if (Utils.isMobile()) this.closeSidebar();
                },

                            }
                        }

                    DOM.modelName.textContent = state.userSettings.isPremium ? t.premiumModel : t.standardModel;
                    
                    document.querySelectorAll('.example-card').forEach((card, index) => {

                        if (textDiv && t.exampleQuestions[index]) {

                            card.dataset.question = t.exampleQuestions[index];
                        }
                    });
                    
                    document.querySelectorAll('.language-option').forEach(opt => {
                        opt.classList.toggle('active', opt.dataset.lang === lang);
                    });
                    
                    this.updateCharCount();
                },

                updateStatistics() {
                    let totalQuestions = 0;
                    Object.values(state.chats).forEach(chat => {
                        if (chat && chat.messages) {
                            totalQuestions += chat.messages.filter(m => m.role === 'user').length;
                        }
                    });
                    
                    const ratedMessages = Object.values(state.messageRatings);
                    const helpfulCount = ratedMessages.filter(r => r === 'like').length;
                    const helpfulPercentage = ratedMessages.length > 0 ? 
                        Math.round((helpfulCount / ratedMessages.length) * 100) : 0;
                    
                    document.getElementById('stat-total').textContent = totalQuestions;
                    document.getElementById('stat-helpful').textContent = `${helpfulPercentage}%`;
                    document.getElementById('stat-language').textContent = state.userSettings.language.toUpperCase();
                    
                    const t = texts[state.userSettings.language] || texts.ru;
                    DOM.accountStatus.textContent = state.userSettings.isPremium ? t.premiumStatus : t.free;
                    DOM.accountStatus.style.color = state.userSettings.isPremium ? 'var(--premium)' : 'var(--text-secondary)';
                },

                updateAdminStats() {
                    const t = texts[state.userSettings.language] || texts.ru;
                    
                    state.adminStats.totalUsers = Object.keys(state.adminStats.allUsers).length;
                    
                    const today = new Date().toDateString();
                    state.adminStats.activeUsersToday = Object.values(state.adminStats.allUsers).filter(user => {
                        return user.lastActive && new Date(user.lastActive).toDateString() === today;
                    }).length;
                    
                    state.adminStats.premiumUsers = Object.values(state.adminStats.allUsers).filter(user => {
                        return user.premiumUntil && new Date(user.premiumUntil) > new Date();
                    }).length;
                    
                    DOM.adminAdsTotalImpressions.textContent = state.userSettings.adStats.totalImpressions;
                    DOM.adminAdsTotalClicks.textContent = state.userSettings.adStats.totalClicks;
                    
                    const ctr = state.userSettings.adStats.totalImpressions > 0 ? 
                        ((state.userSettings.adStats.totalClicks / state.userSettings.adStats.totalImpressions) * 100).toFixed(1) : '0.0';
                    DOM.adminAdsCTR.textContent = `${ctr}%`;
                    
                    DOM.adminTotalUsers.textContent = state.adminStats.totalUsers;
                    DOM.adminActiveUsers.textContent = state.adminStats.activeUsersToday;
                    DOM.adminPremiumUsers.textContent = state.adminStats.premiumUsers;
                    
                    this.updateAdsList();
                },

                updateAdsList() {

                deleteAd(index) {

                        state.ads.splice(index, 1);

                        this.updateAdsList();
                        this.updateSidebarAd();
                    }
                },

                toggleTheme() {
                    const isDark = document.body.classList.toggle('dark-theme');
                    state.userSettings.theme = isDark ? 'dark' : 'light';
                    this.saveSettings();
                    document.getElementById('theme-toggle').querySelector('i').className = isDark ? 'fas fa-sun' : 'fas fa-moon';
                },

                toggleSidebar() {
                    if (Utils.isMobile()) {
                        const isActive = DOM.sidebar.classList.toggle('active');
                        DOM.mobileOverlay.classList.toggle('active', isActive);
                        document.body.style.overflow = isActive ? 'hidden' : '';
                    } else {
                        const isHidden = DOM.sidebar.classList.toggle('hidden');
                        state.userSettings.sidebarHidden = isHidden;
                        this.saveSettings();
                        DOM.sidebarToggle.querySelector('i').className = isHidden ? 'fas fa-chevron-left' : 'fas fa-chevron-right';
                    }
                },

                closeSidebar() {
                    if (Utils.isMobile()) {
                        DOM.sidebar.classList.remove('active');
                        DOM.mobileOverlay.classList.remove('active');
                        document.body.style.overflow = '';
                    }
                },

                updateSidebarState() {
                    if (!Utils.isMobile()) {
                        if (state.userSettings.sidebarHidden) {
                            DOM.sidebar.classList.add('hidden');
                            DOM.sidebarToggle.querySelector('i').className = 'fas fa-chevron-left';
                        } else {
                            DOM.sidebar.classList.remove('hidden');
                            DOM.sidebarToggle.querySelector('i').className = 'fas fa-chevron-right';
                        }
                    }
                },

                applyTheme() {
                    if (state.userSettings.theme === 'dark') {
                        document.body.classList.add('dark-theme');
                        document.getElementById('theme-toggle').querySelector('i').className = 'fas fa-sun';
                    }
                },

                        DOM.sidebar.classList.remove('hidden');
                        DOM.sidebar.classList.add('active');
                        setTimeout(() => this.closeSidebar(), 100);
                    }
                },

                    DOM.charCount.textContent = `${DOM.messageInput.value.length}/${maxLength}`;
                },

                    }

                            const premiumBadge = document.createElement('div');

                        }

                    }

                    if (!state.userSettings.isPremium && state.adminStats.adsEnabled && !isAdmin && Array.isArray(state.ads) && state.ads.length > 0) {

                        if (ad.company) {

                            DOM.sidebarAdCompany.style.display = 'block';

                            DOM.sidebarAdCompany.style.display = 'none';
                        }

                            DOM.sidebarAdLink.href = ad.link;

                        state.currentAdIndex = (state.currentAdIndex + 1) % state.ads.length;

                        DOM.sidebarAd.classList.remove('show');
                    }

                startAdRotation() {
                    if (state.adChangeInterval) {
                        clearInterval(state.adChangeInterval);
                    }
                    
                    state.adChangeInterval = setInterval(() => {
                        this.updateSidebarAd();
                    }, 10000);

                openAdLink() {
                    if (state.currentAd) {
                        if (state.currentAd.isPremiumPromo) {
                            DOM.premiumModal.classList.add('active');
                            this.selectPremiumPlan(state.selectedPremiumPlan);
                        } else if (state.currentAd.link && !state.userSettings.isPremium) {
                            const adIndex = state.ads.findIndex(ad => ad.text === state.currentAd.text);
                            if (adIndex !== -1) {
                                Utils.trackAdClick(adIndex);
                                window.open(state.currentAd.link, '_blank');
                            }
                        }
                    }

                setupPremiumPlanSelection() {
                    DOM.premiumPlanMonthly.addEventListener('click', () => {
                        this.selectPremiumPlan('monthly');
                    });
                    
                    DOM.premiumPlanYearly.addEventListener('click', () => {
                        this.selectPremiumPlan('yearly');
                    });
                    
                    this.selectPremiumPlan(state.selectedPremiumPlan);
                },

                selectPremiumPlan(plan) {
                    state.selectedPremiumPlan = plan;
                    
                    DOM.premiumPlanMonthly.classList.remove('selected');
                    DOM.premiumPlanYearly.classList.remove('selected');
                    
                    const popularBadgeMonthly = DOM.premiumPlanMonthly.querySelector('.popular-badge');
                    const popularBadgeYearly = DOM.premiumPlanYearly.querySelector('.popular-badge');
                    
                    if (plan === 'monthly') {
                        DOM.premiumPlanMonthly.classList.add('selected');
                        if (popularBadgeMonthly) popularBadgeMonthly.style.display = 'block';
                        if (popularBadgeYearly) popularBadgeYearly.style.display = 'none';
                    } else if (plan === 'yearly') {
                        DOM.premiumPlanYearly.classList.add('selected');
                        if (popularBadgeMonthly) popularBadgeMonthly.style.display = 'none';
                        if (popularBadgeYearly) popularBadgeYearly.style.display = 'block';
                    } else {
                        if (popularBadgeMonthly) popularBadgeMonthly.style.display = 'none';
                        if (popularBadgeYearly) popularBadgeYearly.style.display = 'none';
                    }
                },

                setupTelegramAuth() {
                    const urlParams = new URLSearchParams(window.location.search);
                    const tgAuthToken = urlParams.get('tg_auth');
                    
                    if (tgAuthToken) {
                        this.verifyTelegramToken(tgAuthToken);
                    }
                    
                    if (Telegram && Telegram.initDataUnsafe && Telegram.initDataUnsafe.user) {
                        const user = Telegram.initDataUnsafe.user;
                        const userData = {
                            name: user.first_name || 'Пользователь',
                            id: user.id,
                            isPremium: false,
                            photo_url: user.photo_url
                        };
                        saveToStorage('neuroflora_user', userData);
                        DOM.telegramAuthContainer.style.display = 'none';
                        this.setupUserProfile();
                    } else {
                        const savedUser = loadFromStorage('neuroflora_user', null);
                        if (savedUser) {
                            DOM.telegramAuthContainer.style.display = 'none';
                        } else {
                            DOM.telegramAuthContainer.style.display = 'block';
                        }
                    }
                    
                    DOM.telegramAuthBtn.addEventListener('click', () => {
                        window.open('https://t.me/NeuroFloraBot?start=connect', '_blank');
                    });
                },

                async verifyTelegramToken(token) {
                    try {
                        const response = await fetch('https://api.telegram.org/bot8312443089:AAGHcVlmlEhlzJf_XMbsvr_eQ-2Qg9sxeWs/getMe');
                        const data = await response.json();
                        
                        if (data.ok) {
                            const userData = {
                                name: 'Telegram User',
                                id: Date.now(),
                                isPremium: false,
                                photo_url: null
                            };
                            saveToStorage('neuroflora_user', userData);
                            location.reload();
                        }
                    } catch (error) {
                        console.error('Token verification failed:', error);
                    }
                },

                saveChats() {
                    saveToStorage('neuroflora_chats', state.chats);
                },

                saveSettings() {
                    saveToStorage('neuroflora_settings', state.userSettings);
                },

                saveAdminStats() {
                    saveToStorage('neuroflora_admin_stats', state.adminStats);
                },

                setupEventListeners() {
                    DOM.sendButton.addEventListener('click', () => this.sendMessage());
                    DOM.messageInput.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' && !e.shiftKey) {
                            e.preventDefault();
                            this.sendMessage();
                        }
                    });
                    DOM.messageInput.addEventListener('input', () => {
                        this.updateCharCount();
                        Utils.autoResizeTextarea(DOM.messageInput);
                    });
                    DOM.newChatBtn.addEventListener('click', () => this.createNewChat());
                    DOM.clearChatBtn.addEventListener('click', () => this.clearCurrentChat());
                    DOM.themeToggle.addEventListener('click', () => this.toggleTheme());
                    DOM.premiumShortcutBtn.addEventListener('click', () => {
                        DOM.premiumModal.classList.add('active');
                        this.selectPremiumPlan(state.selectedPremiumPlan);
                    });
                    DOM.menuToggle.addEventListener('click', () => this.toggleSidebar());
                    DOM.sidebarToggle.addEventListener('click', () => this.toggleSidebar());
                    DOM.mobileOverlay.addEventListener('click', () => this.closeSidebar());
                    document.querySelectorAll('.nav-item').forEach(item => {
                        item.addEventListener('click', () => {
                            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
                            item.classList.add('active');
                            if (Utils.isMobile()) this.closeSidebar();
                        });
                    });
                    DOM.settingsBtn.addEventListener('click', () => {
                        DOM.settingsModal.classList.add('active');
                        this.updateStatistics();
                        if (Utils.isMobile()) this.closeSidebar();
                    });
                    DOM.premiumBtn.addEventListener('click', () => {
                        DOM.premiumModal.classList.add('active');
                        this.selectPremiumPlan(state.selectedPremiumPlan);
                        if (Utils.isMobile()) this.closeSidebar();
                    });
                    DOM.adminBtn.addEventListener('click', () => {
                        DOM.adminModal.classList.add('active');
                        this.updateAdminStats();
                        if (Utils.isMobile()) this.closeSidebar();
                    });
                    DOM.sidebarAd.addEventListener('click', (e) => {
                        if (e.target.tagName === 'A') return;
                        this.openAdLink();
                    });
                    DOM.modalClose.addEventListener('click', () => {
                        DOM.settingsModal.classList.remove('active');
                    });
                    DOM.premiumModalClose.addEventListener('click', () => {
                        DOM.premiumModal.classList.remove('active');
                    });
                    DOM.adminModalClose.addEventListener('click', () => {
                        DOM.adminModal.classList.remove('active');
                    });
                    DOM.settingsModal.addEventListener('click', (e) => {
                        if (e.target === DOM.settingsModal) {
                            DOM.settingsModal.classList.remove('active');
                        }
                    });
                    DOM.premiumModal.addEventListener('click', (e) => {
                        if (e.target === DOM.premiumModal) {
                            DOM.premiumModal.classList.remove('active');
                        }
                    });
                    DOM.adminModal.addEventListener('click', (e) => {
                        if (e.target === DOM.adminModal) {
                            DOM.adminModal.classList.remove('active');
                        }
                    });
                    document.querySelectorAll('.language-option').forEach(option => {
                        option.addEventListener('click', () => {
                            const lang = option.dataset.lang;
                            state.userSettings.language = lang;
                            this.saveSettings();
                            this.updateInterfaceLanguage();
                            this.updateStatistics();
                            const t = texts[lang] || texts.ru;
                            alert(t.languageChanged);
                        });
                    });
                    document.querySelectorAll('.example-card').forEach(card => {
                        card.addEventListener('click', () => {
                            const question = card.dataset.question;
                            DOM.messageInput.value = question;
                            Utils.autoResizeTextarea(DOM.messageInput);
                            this.updateCharCount();
                            setTimeout(() => DOM.messageInput.focus(), 100);
                        });
                    });
                    
                    DOM.adminTabs.forEach(tab => {
                        tab.addEventListener('click', () => {
                            const tabName = tab.dataset.tab;
                            
                            DOM.adminTabs.forEach(t => t.classList.remove('active'));
                            tab.classList.add('active');
                            
                            DOM.adminTabContents.forEach(content => {
                                content.classList.remove('active');
                                if (content.id === `admin-${tabName}-tab`) {
                                    content.classList.add('active');
                                }
                            });
                        });
                    });
                    
                    DOM.adminAddAd.addEventListener('click', () => {
                        const text = DOM.adminNewAdText.value.trim();
                        const company = DOM.adminNewAdCompany.value.trim();
                        const link = DOM.adminNewAdLink.value.trim();
                        const erid = DOM.adminNewAdErid.value.trim();
                        
                        if (!text) {
                            alert('Введите текст рекламы');
                            return;
                        }
                        
                        const newAd = {
                            text: text,
                            company: company || "Румянцев Семен Михайлович",
                            link: link || '',
                            erid: erid || '',
                            isPremiumPromo: false
                        };
                        
                        state.ads.push(newAd);
                        saveToStorage('neuroflora_ads', state.ads);
                        
                        DOM.adminNewAdText.value = '';
                        DOM.adminNewAdCompany.value = '';
                        DOM.adminNewAdLink.value = '';
                        DOM.adminNewAdErid.value = '';
                        
                        this.updateAdsList();
                        this.updateSidebarAd();
                        alert('Реклама добавлена!');
                    });
                    
                    window.addEventListener('resize', () => {
                        this.handleMobileView();
                        if (window.innerWidth > 768) this.closeSidebar();
                    });
                }
            };

            document.addEventListener('DOMContentLoaded', () => App.init());
        })();
    </script>
</body>
</html>
